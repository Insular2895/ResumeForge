<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResumeForge · OnlyOffice Minimal Test</title>
    <script type="application/json" id="onlyoffice-config">{{ onlyoffice_config | tojson }}</script>
    <script type="application/json" id="onlyoffice-api-url">{{ (document_server_url ~ '/web-apps/apps/api/documents/api.js') | tojson }}</script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #debug {
        box-sizing: border-box;
        margin: 0;
        padding: 12px;
        min-height: 120px;
        background: #111827;
        color: #d1d5db;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #editor {
        width: 100%;
        height: calc(100vh - 120px);
      }
    </style>
  </head>
  <body>
    <pre id="debug">Initialisation du test minimal OnlyOffice...</pre>
    <div id="editor"></div>

    <script>
      const config = JSON.parse(document.getElementById("onlyoffice-config").textContent);
      const apiUrl = JSON.parse(document.getElementById("onlyoffice-api-url").textContent);
      const sessionId = "{{ onlyoffice.session_id }}";
      const kind = "{{ kind }}";
      const debug = document.getElementById("debug");

      function sendClientEvent(event, data = {}) {
        fetch("/onlyoffice/client-events", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            event,
            session_id: sessionId,
            kind,
            url: window.location.href,
            api_url: apiUrl,
            user_agent: navigator.userAgent,
            ...data,
          }),
        }).catch(() => {});
      }

      function editorFrameSrc() {
        return document.querySelector("#editor iframe, iframe[name='frameEditor']")?.src || "pas encore créée";
      }

      function writeDebug(eventName) {
        const lines = [
          `event: ${eventName}`,
          `apiUrl: ${apiUrl}`,
          `session_id: ${sessionId}`,
          `kind: ${kind}`,
          `document.url: ${config?.document?.url || "—"}`,
          `callbackUrl: ${config?.editorConfig?.callbackUrl || "—"}`,
          `iframe.src: ${editorFrameSrc()}`,
        ];
        debug.textContent = lines.join("\n");
      }

      function loadOnlyOfficeApi() {
        writeDebug("minimal-page-loaded");
        sendClientEvent("minimal-page-loaded");
        const script = document.createElement("script");
        script.src = `${apiUrl}?minimal=${Date.now()}`;
        script.onload = () => {
          writeDebug("minimal-api-script-loaded");
          sendClientEvent("minimal-api-script-loaded");
          if (!window.DocsAPI?.DocEditor) {
            writeDebug("minimal-docsapi-missing");
            sendClientEvent("minimal-docsapi-missing");
            return;
          }
          config.events = {
            ...(config.events || {}),
            onAppReady: () => {
              writeDebug("minimal-onAppReady");
              sendClientEvent("minimal-onAppReady", { frame_url: editorFrameSrc() });
            },
            onDocumentReady: () => {
              writeDebug("minimal-onDocumentReady");
              sendClientEvent("minimal-onDocumentReady", { frame_url: editorFrameSrc() });
            },
            onError: (event) => {
              const message = String(event?.data?.message || event?.data || "Erreur OnlyOffice");
              writeDebug(`minimal-onError: ${message}`);
              sendClientEvent("minimal-onError", { message, frame_url: editorFrameSrc() });
            },
          };
          new DocsAPI.DocEditor("editor", config);
          window.setTimeout(() => {
            writeDebug("minimal-editor-created");
            sendClientEvent("minimal-editor-created", { frame_url: editorFrameSrc() });
          }, 0);
        };
        script.onerror = () => {
          writeDebug("minimal-api-script-error");
          sendClientEvent("minimal-api-script-error");
        };
        document.head.appendChild(script);
      }

      loadOnlyOfficeApi();
    </script>
  </body>
</html>
